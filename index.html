<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>汽車駕照模擬考</title><style>body{margin:0;background:#f5f7fb;color:#202c40;font:16px system-ui,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:22px 15px}header,.card{background:white;border:1px solid #e2e7ef;border-radius:14px;padding:20px;margin-bottom:15px}header h1{margin:0 0 10px}button{font:inherit;padding:11px 16px;border:1px solid #cad2df;border-radius:9px;background:white;cursor:pointer}button.main{color:white;background:#254b7b}button:disabled{opacity:.45}.choice{display:block;width:100%;text-align:left;margin:9px 0;line-height:1.7}.choice.selected{background:#dbeafe;border-color:#4068a2}.muted{color:#66748a}.hide{display:none}.score{font-size:35px;font-weight:800}h3{line-height:1.7}</style><main class="wrap"><header><h1>汽車筆試模擬考</h1><div class="muted">題庫版本：115.5.29｜每題 2 分｜答題時隱藏正解</div><p id="status">試行版：完整 PDF 題庫尚待上傳。</p><button class="main" onclick="start()">開始測驗</button> <button onclick="showMistakes()">練習錯題</button></header><div id="questions"></div><div class="card hide" id="submit"><b id="progress"></b><p><button class="main" onclick="finish()">正式交卷並計分</button></p></div><div id="result"></div></main><script>

[42,3,"拒絕酒精濃度測試，罰多少元？","6 萬元","9 萬元","18 萬元"],

[67,2,"後方有消防車鳴笛駛近，何者正確？","跟著消防車通過壅塞路段","靠右讓路，通過後正常行駛","消防車過後立即加速跟上"],
[69,2,"哪一種人不得參加汽車駕照考驗？","戒除酒癮並合格者","酒精或麻醉藥品成癮者","酒駕禁考期已滿者"],
[71,3,"超過最高速限 40 公里以上，罰鍰？","1,200～2,400 元","2,400～6,000 元","6,000～36,000 元"],

[97,2,"禁止停車路段有何限制？","禁止臨停但可以停車","禁止停車但可臨停","停車與臨停都不行"],

let pool=SEED,active=[],answers={},done=false;
function mix(a){let v=[...a];for(let i=v.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[v[i],v[j]]=[v[j],v[i]]}return v}
function note(t){let s=t[2];return /酒|酒測|酒精|酒駕/.test(s)?'重點整理：酒駕相關的年限、金額、吊扣與吊銷應分開記憶。':/停車|臨停/.test(s)?'分清楚禁止停車與禁止臨時停車，並記住黃線和紅線的差別。':/方向燈|車道|超車/.test(s)?'變換車道應保持安全距離、顯示方向燈並確認死角。':'重讀題目的限制條件，特別注意「不得」「應」及數字。'}
function save(){localStorage.setItem('drivingWrong',JSON.stringify([...new Set([...(JSON.parse(localStorage.getItem('drivingWrong')||'[]')),...active.filter((q,i)=>answers[i]!==q[1]).map(q=>q[0])])]));}
function start(mistakes=false){let wrong=JSON.parse(localStorage.getItem('drivingWrong')||'[]');let src=mistakes?SEED.filter(q=>wrong.includes(q[0])):SEED;active=mix(src).slice(0,Math.min(50,src.length));answers={};done=false;render()}
function showMistakes(){start(true)}
function render(){document.getElementById('status').textContent='目前可作答 '+SEED.length+' 題（完整 PDF 尚待匯入）；此次 '+active.length+' 題，每題 2 分。';document.getElementById('result').innerHTML='';let o=document.getElementById('questions');o.innerHTML=active.map((q,i)=>'<section class="card"><div class="muted">第 '+(i+1)+' / '+active.length+' 題</div><h3>'+q[2]+'</h3>'+q.slice(3).map((x,j)=>'<button class="choice" data-i="'+i+'" data-v="'+(j+1)+'">'+(j+1)+'．'+x+'</button>').join('')+'</section>').join('');o.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{if(done)return;answers[+b.dataset.i]=+b.dataset.v;document.querySelectorAll('[data-i="'+b.dataset.i+'"]').forEach(x=>x.classList.toggle('selected',x===b));progress()});document.getElementById('submit').classList.toggle('hide',!active.length);progress()}
function progress(){let n=Object.keys(answers).length;document.getElementById('progress').textContent='已作答 '+n+'／'+active.length+' 題'}
function finish(){if(Object.keys(answers).length!==active.length){alert('請先完成所有題目');return}done=true;let wrong=active.map((q,i)=>({q,i})).filter(x=>answers[x.i]!==x.q[1]);save();let score=(active.length-wrong.length)*2;document.getElementById('questions').innerHTML='';document.getElementById('submit').classList.add('hide');document.getElementById('result').innerHTML='<section class="card"><h2>測驗結果</h2><div class="score">'+score+' / '+(active.length*2)+'</div><p>答對 '+(active.length-wrong.length)+' 題，答錯 '+wrong.length+' 題</p><button class="main" onclick="start()">重新隨機測驗</button></section>'+wrong.map(({q,i})=>'<section class="card"><h3>原題號 '+q[0]+'｜'+q[2]+'</h3><p>你的選擇：'+q[2+answers[i]]+'</p><p>正確答案：'+q[2+q[1]]+'</p><p><b>記憶重點：</b>'+note(q)+'</p></section>').join('');window.scrollTo(0,0)}
</script></html>
