name: Improve existing traffic-sign pictures only
on:
  push:
    paths:
      - '.github/workflows/original-pdf-figures.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: driving-exam-image-enhancement
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image tools
        run: python -m pip install --quiet pillow
      - name: Enhance 189 original question diagrams without altering question data
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          from PIL import Image,ImageEnhance,ImageFilter
          bank=json.loads(pathlib.Path('data/quiz-text.json').read_text(encoding='utf-8'))
          flagged=[q['n'] for q in bank if q.get('fig')]
          assert len(bank)==1090 and len(flagged)==189 and len(set(flagged))==189
          originals={p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in ('index.html','data/quiz-text.json','firebase-config.js','cloud-sync.js')}
          directory=pathlib.Path('figures-hq')
          for n in flagged:
            path=directory/f'{n}.png'
            assert path.is_file() and path.stat().st_size>100, f'Missing image for question {n}'
            with Image.open(path) as old:
              old.load()
              assert old.width>=20 and old.height>=20, f'Diagram too small for {n}'
              # Optimize the already-extracted figure without shifting its bounds or content.
              src=old.convert('RGB')
              if max(src.size)<1600:
                resized=src.resize((src.width*2,src.height*2),Image.Resampling.LANCZOS)
              else:
                resized=src
              tuned=ImageEnhance.Contrast(resized).enhance(1.10)
              tuned=tuned.filter(ImageFilter.UnsharpMask(radius=1.35,percent=175,threshold=3))
              tuned.save(path,format='PNG',optimize=True)
              with Image.open(path) as check:
                check.verify()
          for p,sha in originals.items():
            assert hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest()==sha, f'Protected file changed: {p}'
          print('PASS: 189 enhanced images verified; 1090 question records and application files unchanged.')
          PY
      - name: Commit figure files only
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- figures-hq/
          if ! git diff --cached --quiet; then
            git commit -m "Improve 189 traffic-sign figure clarity only"
            git push
          fi
